name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    # Os testes ponta a ponta da conta precisam de um banco de verdade.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: life
          POSTGRES_DB: life
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U life -d life"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://life:life@localhost:5433/life?schema=public
      JWT_SECRET: segredo-so-da-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Preparar o banco
        run: npm run prisma:deploy -w @life/api

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

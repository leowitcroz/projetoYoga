# Banco de dados local para desenvolvimento.
# Subir: npm run db:up · Parar: npm run db:down
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life
      POSTGRES_DB: life
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U life -d life']
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail local (F2.9): a API manda os e-mails para cá em vez de
  # mandar para o mundo. Veja o que foi enviado em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_MAX_MESSAGES: 200

volumes:
  db-data:
